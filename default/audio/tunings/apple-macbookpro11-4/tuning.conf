## Apple Inc. MacBookPro11,4 internal speakers.
##
## Fitted by the Omarchy Speaker Calibrator from a swept-sine measurement of
## the speakers with an external measuring microphone at the listening position. The sections and the limiter are in
## filter-chain.conf. Harmonic bass is included; the plugin's dynamic loudness
## compensation and volume tracking are not part of this fixed tuning.

description="Apple Inc. MacBookPro11,4 speakers"
## Deep bass is included: harmonics of the bass below the knee, made from built-in nodes.
## Matched only to the measured DMI product name; this machine has no SKU.
match_dmi=("MacBookPro11,4")   ## no DMI SKU on this machine; substring of the product name
## The internal speaker sink, as PipeWire names it on this machine.  Plain
## dots on purpose: Omarchy hands this to awk -v, which eats backslashes.
sink_pattern='^alsa_output.pci-0000_00_1b.0.analog-stereo$'
## Wired headphones share this ALSA sink. The host stops the graph while any
## other port is active, so headphones use the physical sink without DSP.
sink_port="analog-output-speaker"

## Provenance.
derived_from="Omarchy Speaker Calibrator 1.2.0: sweep measurement with an external measuring microphone at the listening position, warm target, measured 2026-10-03"
validated_by=""   ## Listening and port switching passed; post-export acoustic verification is pending.
validated_on=""   ## The original measurement date is recorded in derived_from.
validated_hardware="Apple Inc. MacBookPro11,4"

## Measurement provenance: a calibrated UMIK-1 at the listening position.
## The measurement was accepted with repeatability and harmonic-residual warnings.
## The RMS figure is the acoustic fit error against the calibrator's warm target.
## Electrical measurements on 2026-10-07 captured the DSP input and physical
## speaker sink monitor at 48 kHz; changing physical volume did not affect it.
## Full-chain delay was measured with repeated 30-300 Hz multisines at -40 and
## -30 dBFS (3.82 and 3.84 ms swings on both channels). Near-full-scale sines,
## a multitone and a square wave reached the limiter ceiling, -1.002 dBFS,
## leaving 1.00 dB to full scale and effectively zero below its own threshold.
## LRA is after minus before a 30-second pink-noise programme with six level
## blocks; a real music capture and post-export acoustic check remain pending.
## Measurements.
magnitude_rms_db="12.97"   ## against the calibrator's target, perceptually weighted
bass_group_delay_swing_ms="3.84"   ## measured full chain, 30-300 Hz; includes harmonic bass
limiter_headroom_db="0.00"   ## limiter threshold minus worst observed sample peak; 1.00 dB below full scale
dynamic_range_delta_lu="-0.2"   ## varied-level pink noise: 22.8 minus 23.0 LU, ffmpeg ebur128
